name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5

      - name: Build and link pinned Vizmatic
        run: ./factory/setup-vizmatic.sh

      - name: Typecheck and run Vizmatic layout checks on all videos
        run: uv run factory/build.py --all --check-only

      - name: Verify static site generator
        run: node factory/build-site.mjs

      - name: Run Rust Concurrency Cargo lab tests
        working-directory: videos/rust-concurrency/lab
        run: cargo test --locked
